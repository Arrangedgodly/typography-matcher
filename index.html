<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Judge curated Google Fonts pairings with identities hidden; reveal and export your saves as ready-to-paste CSS."
    />
    <meta name="theme-color" content="#F2EEE6" />
    <title>&ldquo;Blind Test&rdquo; Typography Matcher</title>
    <!-- Chrome face: IBM Plex Sans — a workhorse UI face under the
         no-chart-letterforms constraint (design-brief §3 honest risk). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      THESIS: Pairings judged the way lenses are — which is better, one or two —
      identity withheld until the prescription is written.
      OWN-WORLD: An optician's examination lane: bone walls, instrument-black
      ink, one red–green duochrome bar. No gallery, no dashboard, no letter charts.
      STORY: Land, read one line of protocol, judge page after page, save or skip
      on the bar, leave with a prescription that names each save.
      FIRST VIEWPORT: One viewport: a thin instrument strip (wordmark, meter
      ticks, prescription count) above the essay as a chart sheet center-stage;
      centered below, the split red–green bar — skip left, save right.
      FORM: The Examination Room — rolled, kept; seed fab7b459. Clinical neutral
      ground so any face can star; one cord of color, reserved for judgment.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
